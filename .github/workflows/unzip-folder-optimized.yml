name: Auto Unzip Folder to Root

on:
  push:
    paths:
      - 'upload.zip'
    branches:
      - upload
      - main
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Confirm overwrite of existing files'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# v1.2.3 round-79 (ROB-06): serialize runs per ref — two overlapping runs on the
#   same ref would race their stash/pull/pop sequences and their staging scope.
concurrency:
  group: unzip-folder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if upload.zip exists
        id: check_zip
        run: |
          if [ -f "upload.zip" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found upload.zip"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ upload.zip not found"
          fi

      - name: Validate ZIP file (structural preflight)
        if: steps.check_zip.outputs.exists == 'true'
        id: validate
        run: |
          # Check file size (max 100MB)
          FILE_SIZE=$(stat -c%s "upload.zip")
          MAX_SIZE=$((100 * 1024 * 1024))
          echo "📦 ZIP size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::upload.zip exceeds 100MB limit ($FILE_SIZE bytes)"
            exit 1
          fi

          # v1.2.3 round-79 (ROB-06): structural, entry-by-entry preflight BEFORE
          #   anything is written to disk. The old checks grepped the textual
          #   `unzip -l` listing and only warned; the post-extraction cleanup used
          #   `find ./extracted -path './extracted/.github/workflows/*'`, which a
          #   nested `Regalia-upload/.github/workflows/x.yml` member does not
          #   match (nested-prefix bypass — the round-76 review reproduced this
          #   file-system model: the top-level copy was deleted, the nested one
          #   survived into the repo). Now every member name is normalized and
          #   checked at ANY depth: traversal/absolute/encrypted/budget violations
          #   fail the run immediately; protected components at any depth are
          #   listed and structurally skipped during extraction (the channel
          #   itself keeps working for zips that merely carry such entries).
          python3 - <<'PY'
          import re
          import sys
          import zipfile

          PROTECTED_DIR_COMPONENTS = {".git", ".github", "gradle"}
          PROTECTED_BASENAMES = {"gradlew", "gradlew.bat", "local.properties",
                                 "keystore.properties", "keystore-info.txt"}
          PROTECTED_SUFFIXES = (".keystore", ".jks", ".p12", ".pfx", ".idsig", ".so")
          MAX_MEMBERS = 20000
          MAX_MEMBER_BYTES = 128 * 1024 * 1024
          MAX_TOTAL_BYTES = 512 * 1024 * 1024

          def fail(reason: str) -> None:
              print(f"::error::upload.zip rejected: {reason}")
              sys.exit(1)

          with zipfile.ZipFile("upload.zip") as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)):
                  fail("duplicate member names")
              if len(infos) > MAX_MEMBERS:
                  fail(f"member count {len(infos)} exceeds {MAX_MEMBERS}")
              total = 0
              skipped = []
              manifest = []
              for info in infos:
                  name = info.filename
                  if name.startswith("/") or "\\" in name:
                      fail(f"absolute or backslash member path: {name!r}")
                  if re.match(r"^[A-Za-z]:", name):
                      fail(f"drive-letter member path: {name!r}")
                  parts = [part for part in name.split("/")]
                  if any(part == ".." for part in parts):
                      fail(f"path traversal member: {name!r}")
                  if name.endswith("upload.zip") or "/upload.zip" in name:
                      fail("member named upload.zip would overwrite the channel input")
                  if info.flag_bits & 0x1:
                      fail(f"encrypted member: {name!r}")
                  if info.file_size < 0 or info.file_size > MAX_MEMBER_BYTES:
                      fail(f"member exceeds per-member budget: {name!r}")
                  total += info.file_size
                  if total > MAX_TOTAL_BYTES:
                      fail(f"decompressed total exceeds {MAX_TOTAL_BYTES} bytes")
                  protected = False
                  for part in parts[:-1]:
                      if part.lower() in PROTECTED_DIR_COMPONENTS:
                          protected = True
                          break
                  basename = parts[-1].lower() if parts[-1] else ""
                  if basename in PROTECTED_BASENAMES or basename.endswith(PROTECTED_SUFFIXES):
                      protected = True
                  if basename.startswith((":", "!", "^")):
                      fail(f"member basename starts with a pathspec magic character: {name!r}")
                  if protected:
                      skipped.append(name)
                      continue
                  manifest.append(name)
              with open("/tmp/protected-members.txt", "w", encoding="utf-8") as out:
                  out.write("\n".join(skipped) + ("\n" if skipped else ""))
              with open("/tmp/extracted-manifest.txt", "w", encoding="utf-8") as out:
                  out.write("\n".join(manifest) + ("\n" if manifest else ""))
              print(f"📋 ZIP members: {len(infos)} (protected skipped: {len(skipped)})")
              print(f"📦 Decompressed total: {total} bytes")
          PY

          if [ -s /tmp/protected-members.txt ]; then
            echo "::warning::Protected paths skipped (will NOT land in the repository, at any nesting depth):"
            sed 's/^/  /' /tmp/protected-members.txt
          fi

          # List contents for review
          echo "📋 ZIP contents:"
          unzip -l "upload.zip" | tail -n +4 | head -n -2 || true

          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Unzip with safety checks
        if: steps.check_zip.outputs.exists == 'true' && steps.validate.outputs.valid == 'true'
        id: unzip
        run: |
          # v1.2.3 round-79 (ROB-06): structured extraction — only members that
          #   passed the preflight are written; protected entries are skipped by
          #   name (any nesting depth), not by post-hoc `find` deletion that the
          #   nested-prefix bypass could dodge. The manifest of extracted
          #   members is what the commit step stages.
          mkdir -p ./extracted
          python3 - <<'PY'
          import zipfile
          with open("/tmp/extracted-manifest.txt", encoding="utf-8") as source:
              members = [line.rstrip("\n") for line in source if line.strip()]
          with zipfile.ZipFile("upload.zip") as archive:
              for member in members:
                  archive.extract(member, "./extracted")
          print(f"📁 Extracted {len(members)} members")
          PY

          echo "📁 Files to be added:"
          find ./extracted -type f | sed 's|^./extracted/||' | sort

      - name: Sync with remote and commit
        if: steps.check_zip.outputs.exists == 'true' && steps.validate.outputs.valid == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash local changes
          # v1.2.3 round-79 (ROB-06): `|| true` removed — a failed stash/pull/pop
          #   must abort BEFORE cp -a overwrites the working tree, not be
          #   swallowed and continue on top of a half-merged state.
          if ! git stash push -m "temp-unzip-$(date +%s)"; then
            echo "::error::git stash push failed; aborting before any overwrite"
            exit 1
          fi

          # Pull remote updates
          git pull origin ${{ github.ref_name }} --ff-only || \
          git pull origin ${{ github.ref_name }} --rebase

          # Restore stashed changes — fail closed on conflict (the stash entry is
          #   preserved for manual recovery; the old `|| true` swallowed it and
          #   let the run continue over a conflicting tree).
          if ! git stash pop --index; then
            echo "::error::git stash pop failed (conflict) — the stash entry is preserved for manual recovery; aborting before overwrite"
            git stash list | sed -n '1p'
            exit 1
          fi

          # Copy extracted files to root
          cp -a ./extracted/. ./
          rm -rf ./extracted
          rm -f upload.zip

          # Stage only the extracted files (manifest-driven staging that finally
          #   matches this comment — the old `git add -A` below it also staged
          #   unrelated working-tree changes).
          git add --pathspec-from-file=/tmp/extracted-manifest.txt
          git rm -q --ignore-unmatch upload.zip

          if ! git diff --cached --quiet; then
            git commit -m "chore: auto unzip files to root [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "✅ Changes pushed successfully"
          else
            echo "ℹ️ No changes to commit"
          fi
